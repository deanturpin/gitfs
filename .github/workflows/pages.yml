name: Deploy redirect to Pages

# The app moved to the gitfs2 repository, deployed to Cloudflare Pages. This
# repository now publishes a signpost and nothing else.
#
# The half-hourly refresh is gone with it. It existed to keep buoy readings
# fresh, and GitHub's scheduler was never punctual enough for that — measured
# at a median of 63 minutes and a worst case of over five hours, which is the
# reason the app moved hosts in the first place.
#
# This workflow is disabled. It is kept, rather than deleted, so the redirect
# can be redeployed by hand when the domain is settled: run it from the Actions
# tab, or `gh workflow run pages.yml -R deanturpin/gitfs` after enabling it.

on:
  workflow_dispatch:

# Where the old address sends people. The one place the new domain is written.
env:
  TARGET: https://getinthesea.uk/

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the target into the redirect
        run: |
          set -euo pipefail
          # Bare host for the visible link; full URL everywhere else.
          label="${TARGET#https://}"
          label="${label%/}"
          sed -e "s|__TARGET_LABEL__|${label}|g" -e "s|__TARGET__|${TARGET}|g" \
            redirect/index.html > redirect/index.stamped
          mv redirect/index.stamped redirect/index.html
          # Pages serves 404.html for any unknown path, so a deep link that was
          # never a real page on the old site is redirected as well.
          cp redirect/index.html redirect/404.html
          # A placeholder reaching production would be a broken link.
          ! grep -q '__TARGET' redirect/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

      - id: deployment
        uses: actions/deploy-pages@v4
