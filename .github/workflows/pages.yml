name: Deploy to Pages

on:
  push:
    branches: [main]
  # Buoys report every half hour. GitHub's scheduler is not punctual and
  # routinely fires 10 to 30 minutes late, so treat this as roughly hourly and
  # let the UI show each station's own observation time.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue rather than cancel so a data refresh
# already in flight still reaches production.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # One build definition, shared with Cloudflare Pages, so neither builder
      # can quietly skip a step the other does. See tools/build.sh.
      - name: Build
        run: bash tools/build.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
